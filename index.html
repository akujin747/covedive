<!doctype html>
<html lang="en"
  data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color"
    content="#04060c" />
  <meta name="description"
    content="Core Dive — a vertical descent roguelite by Core Dive Guild. Privacy policy, terms of service, and player support." />
  <title>Core Dive | Vertical Descent Roguelite</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("coredive-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#eef3fa" : "#04060c");
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.setAttribute("data-theme", "light");
        }
        var lang = localStorage.getItem("coredive-lang");
        var map = { en: "en", vi: "vi", zh: "zh-CN", ko: "ko", ja: "ja", de: "de", fr: "fr", es: "es" };
        if (lang && map[lang]) {
          document.documentElement.setAttribute("lang", map[lang]);
        }
      } catch (e) {
        /* ignore */
      }
    })();
  </script>

e:"Vertical Descent Roguelite",description:"Drill deep into the planetary core. Fight endless waves of subterranean enemies, upgrade your ship, and survive the descent. Are you ready for the dive?",privacy:"Privacy Policy",terms:"Terms of Service",contact:"Contact Support",footer:"© 2026 Core Dive Guild. All rights reserved."},legal:{updatedPrefix:"Last Updated:",date:"November 6, 2026",back:"Back to Home"},privacy:{title:"Privacy Policy for Core Dive",intro:'Core Dive Guild ("we", "our", or "us") is committed to protecting your privacy. This Privacy Policy explains how personal information is collected, used, and disclosed by the Core Dive mobile application (the "Game").',s1Title:"1. Information We Collect",s1Intro:"We limit the information used by the Game to what is needed for the features described below:",s1Items:[{lead:"Google Play Games Services:",text:"If you choose to sign in, the Game may access your Play Games ID, display name, and leaderboard scores. This information is used for authentication, cloud saving, and rankings."},{lead:"Advertising (Google AdMob):",text:"The Game uses Google AdMob to provide rewarded video ads. AdMob may collect or receive your Advertising ID and device information to deliver personalized or non-personalized ads, measure ad performance, and help prevent fraud."},{lead:"Game Data:",text:"Your progress—including Coins, Skins, Upgrades, and Achievements—is stored locally on your device and, when Google Play Games sign-in is enabled, synced to Google Play Cloud Save."}],s2Title:"2. How We Use Your Information",s2Text:"Data is used strictly to operate the Game and provide its features. This includes running gameplay, enabling cloud saving and progress synchronization, maintaining leaderboards and rankings, and delivering rewarded ads. We may also use gameplay or diagnostic information to fix errors, protect the Game from abuse, and respond to support requests.",s3Title:"3. Third-Party Sharing",s3a:"We do not sell, trade, or rent your personal information. The only third-party services involved in the data practices described in this policy are Google services: Google Play Games Services for sign-in, cloud saves, and leaderboards, and Google AdMob for advertising. Information processed by those services is also subject to the ",s3Link:"Google Privacy Policy",s3b:".",s4Title:"4. Data Retention and Deletion",s4Items:[{lead:"Local data:",text:"Game data stored on your device is kept until you uninstall the Game or clear its application data."},{lead:"Cloud data:",text:"Cloud-save data is kept while your Google Play account remains linked to the Game, subject to Google's own retention practices."},{lead:"Deletion requests:",text:"You may contact us to request deletion of information associated with the Game. We may need your Play Games ID or other reasonable details to locate the relevant data and verify the request."}],s5Title:"5. Contact Us",s5a:"If you have questions about this Privacy Policy or want to make a privacy or deletion request, contact us at:"},terms:{title:"Terms of Service for Core Dive",intro:'These Terms of Service (the "Terms") govern your use of the Core Dive mobile application (the "Game") provided by Core Dive Guild. By downloading, installing, accessing, or playing the Game, you agree to these Terms. If you do not agree, do not use the Game.',s1Title:"1. License to Use the Game",s1Text:"Subject to these Terms and the terms of the app store from which you obtained the Game, Core Dive Guild grants you a personal, non-exclusive, non-transferable, revocable license to install and use the Game for your own personal, non-commercial entertainment. This license does not give you ownership of the Game or any of its content.",s2Title:"2. User Conduct",s2Intro:"You agree not to engage in conduct that undermines the Game, other players, or Core Dive Guild, including:",s2Items:[{lead:"Cheating and automation:",text:"Using cheats, exploits, bots, hacks, modified clients, scripts, or other unauthorized methods to gain an advantage or manipulate scores, rewards, or gameplay."},{lead:"Reverse engineering:",text:"Copying, modifying, decompiling, disassembling, or reverse engineering the Game, except where such activity is expressly permitted by applicable law."},{lead:"Disruption:",text:"Interfering with or disrupting the Game, its services, servers, networks, or another person's ability to use them."},{lead:"Impersonation:",text:"Misrepresenting your identity or impersonating another person through Google Play Games profiles, display names, or related features."}],s3Title:"3. Virtual Items and Currency",s3p1:"Coins, Skins, Upgrades, and other virtual items made available in the Game are licensed to you, not owned by you. They have no real-world monetary value, are not transferable outside the features expressly provided by the Game, and cannot be exchanged for cash or other consideration.",s3p2:"Purchases are final and non-refundable except where required by applicable law or the relevant app store's policies. Core Dive Guild may manage, modify, suspend, or remove virtual items or currency, including to correct errors, address exploits, or maintain game balance.",s4Title:"4. Advertisements",s4Text:"The Game uses Google AdMob and may offer optional rewarded video ads. A successfully completed rewarded ad may grant the advertised in-game currency or reward. Third-party advertising content is the responsibility of its provider or advertiser, and Core Dive Guild does not endorse third-party products or services shown in ads. Rewards are granted only for ads that are successfully completed and validated by the Game.",s5Title:"5. Google Play Games Services",s5Text:"Signing in to Google Play Games Services is optional, but some features—such as cloud saving and leaderboards—may require it. Your use of those services is also governed by Google's applicable terms and privacy policies. Scores or other submissions associated with cheating or manipulation may be removed, and access to related Game features may be restricted.",s6Title:"6. Intellectual Property",s6Text:"The Game and its content, including code, graphics, artwork, audio, text, interfaces, characters, and related materials, are owned by Core Dive Guild or its licensors and are protected by applicable intellectual property laws. You receive no rights in the Game or its content beyond the limited license described in Section 1.",s7Title:"7. Updates and Changes to the Game",s7Text:"Core Dive Guild may update, modify, suspend, or discontinue the Game or any feature, content, virtual item, or service at any time, including for maintenance, security, balancing, or business reasons, without notice or liability to you.",s8Title:"8. Disclaimer of Warranties",s8Text:'To the maximum extent permitted by applicable law, the Game is provided "as is" and "as available", with all faults and without warranties of any kind, whether express, implied, or statutory. Core Dive Guild does not guarantee that the Game will be uninterrupted, secure, error-free, or compatible with every device, or that saved progress will never be lost.',s9Title:"9. Limitation of Liability",s9Text:"To the maximum extent permitted by applicable law, Core Dive Guild and its licensors will not be liable for any indirect, incidental, special, consequential, or punitive damages, or for any loss of progress, virtual items, currency, or data, arising from or related to your use of or inability to use the Game.",s10Title:"10. Termination",s10Text:"Core Dive Guild may suspend or terminate your access to the Game or specific features, including leaderboards and cloud saving, if you breach these Terms or misuse the Game. You may stop using the Game at any time by uninstalling it. Sections 3, 6, 8, and 9 survive termination, together with any provisions that by their nature should survive.",s11Title:"11. Changes to These Terms",s11Text:'We may update these Terms from time to time. Any updated version will be posted on this page with a new "Last Updated" date. Your continued use of the Game after updated Terms become effective constitutes your acceptance of those Terms.',s12Title:"12. Contact Us",s12a:"If you have questions about these Terms or need support for Core Dive, contact us at:"}},vi:{code:"vi",label:"Tiếng Việt",meta:{homeTitle:"Core Dive | Roguelite Lặn Thẳng Đứng",privacyTitle:"Chính Sách Bảo Mật | Core Dive",termsTitle:"Điều Khoản Dịch Vụ | Core Dive",description:"Core Dive — game roguelite lặn thẳng đứng của Core Dive Guild. Chính sách bảo mật, điều khoản dịch vụ và hỗ trợ người chơi.",langAttr:"vi"},controls:{language:"Ngôn ngữ",dark:"Tối",light:"Sáng",switchToLight:"Chuyển sang giao diện sáng",switchToDark:"Chuyển sang giao diện tối"},landing:{tagline:"Roguelite Lặn Thẳng Đứng",description:"Khoan sâu vào lõi hành tinh. Chiến đấu với vô số đợt kẻ địch dưới lòng đất, nâng cấp tàu của bạn và sống sót qua hành trình lặn sâu. Bạn đã sẵn sàng cho cú lặn chưa?",privacy:"Chính Sách Bảo Mật",terms:"Điều Khoản Dịch Vụ",contact:"Liên Hệ Hỗ Trợ",footer:"© 2026 Core Dive Guild. Bảo lưu mọi quyền."},legal:{updatedPrefix:"Cập Nhật Lần Cuối:",date:"6 tháng 11, 2026",back:"Về Trang Chủ"},privacy:{title:"Chính Sách Bảo Mật cho Core Dive",intro:'Core Dive Guild ("chúng tôi") cam kết bảo vệ quyền riêng tư của bạn. Chính Sách Bảo Mật này giải thích cách thông tin cá nhân được thu thập, sử dụng và tiết lộ bởi ứng dụng di động Core Dive ("Trò Chơi").',s1Title:"1. Thông Tin Chúng Tôi Thu Thập",s1Intro:"Chúng tôi chỉ giới hạn thông tin mà Trò Chơi sử dụng ở mức cần thiết cho các tính năng được mô tả dưới đây:",s1Items:[{lead:"Google Play Games Services:",text:"Nếu bạn chọn đăng nhập, Trò Chơi có thể truy cập ID Play Games, tên hiển thị và điểm xếp hạng của bạn. Thông tin này được dùng để xác thực, lưu trữ đám mây và xếp hạng."},{lead:"Quảng cáo (Google AdMob):",text:"Trò Chơi sử dụng Google AdMob để cung cấp quảng cáo video có thưởng. AdMob có thể thu thập hoặc nhận ID Quảng Cáo và thông tin thiết bị của bạn để phân phối quảng cáo cá nhân hóa hoặc không cá nhân hóa, đo lường hiệu quả quảng cáo và giúp ngăn chặn gian lận."},{lead:"Dữ Liệu Trò Chơi:",text:"Tiến trình của bạn — bao gồm Xu, Trang Phục, Nâng Cấp và Thành Tựu — được lưu cục bộ trên thiết bị và, khi bật đăng nhập Google Play Games, được đồng bộ với Google Play Cloud Save."}],s2Title:"2. Cách Chúng Tôi Sử Dụng Thông Tin Của Bạn",s2Text:"Dữ liệu chỉ được sử dụng để vận hành Trò Chơi và cung cấp các tính năng của nó. Điều này bao gồm vận hành lối chơi, lưu trữ đám mây và đồng bộ tiến trình, duy trì bảng xếp hạng, và phân phối quảng cáo có thưởng. Chúng tôi cũng có thể sử dụng thông tin lối chơi hoặc chẩn đoán để sửa lỗi, bảo vệ Trò Chơi khỏi lạm dụng và phản hồi yêu cầu hỗ trợ.",s3Title:"3. Chia Sẻ Với Bên Thứ Ba",s3a:"Chúng tôi không bán, trao đổi hay cho thuê thông tin cá nhân của bạn. Các dịch vụ bên thứ ba duy nhất liên quan đến hoạt động dữ liệu được mô tả trong chính sách này là các dịch vụ của Google: Google Play Games Services cho đăng nhập, lưu trữ đám mây và bảng xếp hạng, và Google AdMob cho quảng cáo. Thông tin do các dịch vụ đó xử lý cũng phải tuân theo ",s3Link:"Chính Sách Bảo Mật của Google",s3b:".",s4Title:"4. Lưu Trữ và Xóa Dữ Liệu",s4Items:[{lead:"Dữ liệu cục bộ:",text:"Dữ liệu trò chơi lưu trên thiết bị của bạn được giữ lại cho đến khi bạn gỡ cài đặt Trò Chơi hoặc xóa dữ liệu ứng dụng."},{lead:"Dữ liệu đám mây:",text:"Dữ liệu lưu trên đám mây được giữ lại trong khi tài khoản Google Play của bạn vẫn liên kết với Trò Chơi, tuân theo chính sách lưu trữ riêng của Google."},{lead:"Yêu cầu xóa:",text:"Bạn có thể liên hệ với chúng tôi để yêu cầu xóa thông tin liên quan đến Trò Chơi. Chúng tôi có thể cần ID Play Games hoặc các thông tin hợp lý khác để xác định dữ liệu liên quan và xác minh yêu cầu."}],s5Title:"5. Liên Hệ Với Chúng Tôi",s5a:"Nếu bạn có câu hỏi về Chính Sách Bảo Mật này hoặc muốn gửi yêu cầu về quyền riêng tư/xóa dữ liệu, hãy liên hệ với chúng tôi tại:"},terms:{title:"Điều Khoản Dịch Vụ cho Core Dive",intro:'Các Điều Khoản Dịch Vụ này ("Điều Khoản") điều chỉnh việc bạn sử dụng ứng dụng di động Core Dive ("Trò Chơi") do Core Dive Guild cung cấp. Bằng việc tải xuống, cài đặt, truy cập hoặc chơi Trò Chơi, bạn đồng ý với các Điều Khoản này. Nếu bạn không đồng ý, vui lòng không sử dụng Trò Chơi.',s1Title:"1. Giấy Phép Sử Dụng Trò Chơi",s1Text:"Theo các Điều Khoản này và điều khoản của cửa hàng ứng dụng nơi bạn tải Trò Chơi, Core Dive Guild cấp cho bạn giấy phép cá nhân, không độc quyền, không thể chuyển nhượng, có thể thu hồi để cài đặt và sử dụng Trò Chơi cho mục đích giải trí cá nhân, phi thương mại. Giấy phép này không trao cho bạn quyền sở hữu Trò Chơi hay bất kỳ nội dung nào của nó.",s2Title:"2. Quy Tắc Ứng Xử",s2Intro:"Bạn đồng ý không thực hiện các hành vi gây hại cho Trò Chơi, người chơi khác hoặc Core Dive Guild, bao gồm:",s2Items:[{lead:"Gian lận và tự động hóa:",text:"Sử dụng cheat, lợi dụng lỗi, bot, hack, client đã chỉnh sửa, script hoặc các phương thức trái phép khác để trục lợi hoặc thao túng điểm số, phần thưởng hay lối chơi."},{lead:"Dịch ngược:",text:"Sao chép, sửa đổi, dịch ngược, tháo rời hoặc đảo ngược kỹ thuật Trò Chơi, trừ khi pháp luật hiện hành cho phép rõ ràng."},{lead:"Gây gián đoạn:",text:"Can thiệp hoặc làm gián đoạn Trò Chơi, dịch vụ, máy chủ, mạng lưới hoặc khả năng sử dụng của người khác."},{lead:"Mạo danh:",text:"Giả mạo danh tính hoặc mạo danh người khác thông qua hồ sơ, tên hiển thị hoặc các tính năng liên quan của Google Play Games."}],s3Title:"3. Vật Phẩm và Tiền Tệ Ảo",s3p1:"Xu, Trang Phục, Nâng Cấp và các vật phẩm ảo khác trong Trò Chơi chỉ được cấp phép cho bạn, không thuộc sở hữu của bạn. Chúng không có giá trị tiền tệ thực, không thể chuyển nhượng ngoài các tính năng do Trò Chơi cung cấp rõ ràng, và không thể quy đổi thành tiền mặt hay giá trị khác.",s3p2:"Các giao dịch mua là cuối cùng và không được hoàn tiền, trừ khi pháp luật hiện hành hoặc chính sách của cửa hàng ứng dụng yêu cầu. Core Dive Guild có thể quản lý, sửa đổi, tạm ngưng hoặc xóa vật phẩm hoặc tiền tệ ảo, bao gồm để sửa lỗi, xử lý việc lợi dụng lỗi hoặc duy trì cân bằng game.",s4Title:"4. Quảng Cáo",s4Text:"Trò Chơi sử dụng Google AdMob và có thể cung cấp quảng cáo video có thưởng tùy chọn. Quảng cáo có thưởng hoàn thành thành công có thể nhận được tiền tệ hoặc phần thưởng trong game như đã quảng cáo. Nội dung quảng cáo của bên thứ ba là trách nhiệm của nhà cung cấp hoặc nhà quảng cáo, và Core Dive Guild không xác nhận các sản phẩm hay dịch vụ của bên thứ ba xuất hiện trong quảng cáo. Phần thưởng chỉ được trao cho các quảng cáo hoàn thành thành công và được Trò Chơi xác thực.",s5Title:"5. Google Play Games Services",s5Text:"Đăng nhập Google Play Games Services là tùy chọn, nhưng một số tính năng — như lưu trữ đám mây và bảng xếp hạng — có thể yêu cầu đăng nhập. Việc bạn sử dụng các dịch vụ đó cũng phải tuân theo các điều khoản và chính sách bảo mật hiện hành của Google. Điểm số hoặc nội dung gửi lên liên quan đến gian lận hoặc thao túng có thể bị xóa, và quyền truy cập các tính năng liên quan có thể bị hạn chế.",s6Title:"6. Sở Hữu Trí Tuệ",s6Text:"Trò Chơi và nội dung của nó, bao gồm mã nguồn, đồ họa, hình ảnh, âm thanh, văn bản, giao diện, nhân vật và các tài liệu liên quan, thuộc sở hữu của Core Dive Guild hoặc các bên cấp phép và được bảo vệ bởi luật sở hữu trí tuệ hiện hành. Bạn không nhận được quyền nào đối với Trò Chơi hay nội dung của nó ngoài giấy phép hạn chế được mô tả trong Mục 1.",s7Title:"7. Cập Nhật và Thay Đổi Trò Chơi",s7Text:"Core Dive Guild có thể cập nhật, sửa đổi, tạm ngưng hoặc ngừng cung cấp Trò Chơi hoặc bất kỳ tính năng, nội dung, vật phẩm ảo hay dịch vụ nào vào bất kỳ lúc nào, bao gồm vì lý do bảo trì, bảo mật, cân bằng hoặc kinh doanh, mà không cần thông báo hay chịu trách nhiệm với bạn.",s8Title:"8. Tuyên Bố Miễn Trừ Bảo Hành",s8Text:'Trong phạm vi tối đa mà pháp luật hiện hành cho phép, Trò Chơi được cung cấp "nguyên trạng" và "theo khả năng sẵn có", với mọi lỗi và không có bất kỳ bảo hành nào, dù rõ ràng, ngụ ý hay theo luật định. Core Dive Guild không đảm bảo Trò Chơi sẽ hoạt động liên tục, an toàn, không lỗi hay tương thích với mọi thiết bị, hoặc tiến trình đã lưu sẽ không bao giờ bị mất.',s9Title:"9. Giới Hạn Trách Nhiệm",s9Text:"Trong phạm vi tối đa mà pháp luật hiện hành cho phép, Core Dive Guild và các bên cấp phép sẽ không chịu trách nhiệm đối với bất kỳ thiệt hại gián tiếp, ngẫu nhiên, đặc biệt, do hậu quả hoặc mang tính trừng phạt nào, hoặc đối với bất kỳ mất mát nào về tiến trình, vật phẩm ảo, tiền tệ hay dữ liệu, phát sinh từ hoặc liên quan đến việc bạn sử dụng hoặc không thể sử dụng Trò Chơi.",s10Title:"10. Chấm Dứt",s10Text:"Core Dive Guild có thể tạm ngưng hoặc chấm dứt quyền truy cập của bạn vào Trò Chơi hoặc các tính năng cụ thể, bao gồm bảng xếp hạng và lưu trữ đám mây, nếu bạn vi phạm các Điều Khoản này hoặc lạm dụng Trò Chơi. Bạn có thể ngừng sử dụng Trò Chơi bất cứ lúc nào bằng cách gỡ cài đặt. Các Mục 3, 6, 8 và 9 vẫn tiếp tục có hiệu lực sau khi chấm dứt, cùng với bất kỳ điều khoản nào vốn dĩ cần tiếp tục có hiệu lực.",s11Title:"11. Thay Đổi Các Điều Khoản Này",s11Text:'Chúng tôi có thể cập nhật các Điều Khoản này theo thời gian. Mọi phiên bản cập nhật sẽ được đăng trên trang này với ngày "Cập Nhật Lần Cuối" mới. Việc bạn tiếp tục sử dụng Trò Chơi sau khi các Điều Khoản cập nhật có hiệu lực đồng nghĩa với việc bạn chấp nhận các Điều Khoản đó.',s12Title:"12. Liên Hệ Với Chúng Tôi",s12a:"Nếu bạn có câu hỏi về các Điều Khoản này hoặc cần hỗ trợ cho Core Dive, hãy liên hệ với chúng tôi tại:"}},zh:{code:"zh",label:"中文",meta:{homeTitle:"Core Dive | 垂直下潜 Roguelite",privacyTitle:"隐私政策 | Core Dive",termsTitle:"服务条款 | Core Dive",description:"Core Dive —— Core Dive Guild 出品的垂直下潜 Roguelite。隐私政策、服务条款与玩家支持。",langAttr:"zh-CN"},controls:{language:"语言",dark:"深色",light:"浅色",switchToLight:"切换到浅色主题",switchToDark:"切换到深色主题"},landing:{tagline:"垂直下潜 Roguelite",description:"深入钻探星球核心。迎战无尽的地下敌潮，升级你的飞船，在下潜中生存下来。你准备好潜入核心了吗？",privacy:"隐私政策",terms:"服务条款",contact:"联系支持",footer:"© 2026 Core Dive Guild。版权所有。"},legal:{updatedPrefix:"最后更新：",date:"2026年11月6日",back:"返回首页"},privacy:{title:"Core Dive 隐私政策",intro:"Core Dive Guild（“我们”）致力于保护您的隐私。本隐私政策说明 Core Dive 移动应用（“本游戏”）如何收集、使用和披露个人信息。",s1Title:"1. 我们收集的信息",s1Intro:"我们仅将本游戏使用的信息限制在以下功能所需的范围内：",s1Items:[{lead:"Google Play 游戏服务：",text:"如果您选择登录，本游戏可能会访问您的 Play Games ID、显示名称和排行榜分数。这些信息用于身份验证、云存档和排名。"},{lead:"广告（Google AdMob）：",text:"本游戏使用 Google AdMob 提供激励视频广告。AdMob 可能会收集或接收您的广告 ID 和设备信息，以投放个性化或非个性化广告、衡量广告效果并帮助防止欺诈。"},{lead:"游戏数据：",text:"您的进度——包括金币、皮肤、升级和成就——存储在您的本地设备上，并在启用 Google Play 游戏登录后同步到 Google Play 云存档。"}],s2Title:"2. 我们如何使用您的信息",s2Text:"数据仅用于运营本游戏并提供其功能。这包括运行游戏玩法、启用云存档和进度同步、维护排行榜和排名，以及投放激励广告。我们还可能使用游戏或诊断信息来修复错误、防止滥用本游戏，并回复支持请求。",s3Title:"3. 第三方共享",s3a:"我们不会出售、交易或出租您的个人信息。本政策所述数据实践中涉及的唯一第三方服务是 Google 服务：用于登录、云存档和排行榜的 Google Play 游戏服务，以及用于广告的 Google AdMob。这些服务处理的信息还受以下政策约束：",s3Link:"Google 隐私政策",s3b:"。",s4Title:"4. 数据保留与删除",s4Items:[{lead:"本地数据：",text:"存储在您设备上的游戏数据将保留，直到您卸载本游戏或清除应用数据。"},{lead:"云端数据：",text:"在您的 Google Play 账号仍与本游戏关联期间，云存档数据将被保留，并受 Google 自身保留政策约束。"},{lead:"删除请求：",text:"您可以联系我们，要求删除与本游戏相关的信息。我们可能需要您的 Play Games ID 或其他合理信息来定位相关数据并验证请求。"}],s5Title:"5. 联系我们",s5a:"如果您对本隐私政策有疑问，或希望提出隐私/删除请求，请通过以下方式联系我们："},terms:{title:"Core Dive 服务条款",intro:"本服务条款（“本条款”）适用于您对 Core Dive Guild 提供的 Core Dive 移动应用（“本游戏”）的使用。下载、安装、访问或游玩本游戏，即表示您同意本条款。如果您不同意，请勿使用本游戏。",s1Title:"1. 游戏使用许可",s1Text:"在遵守本条款及您获取本游戏的应用商店条款的前提下，Core Dive Guild 授予您一项个人的、非独占的、不可转让的、可撤销的许可，允许您出于个人非商业娱乐目的安装和使用本游戏。该许可不赋予您对本游戏或其任何内容的所有权。",s2Title:"2. 用户行为",s2Intro:"您同意不从事损害本游戏、其他玩家或 Core Dive Guild 的行为，包括：",s2Items:[{lead:"作弊与自动化：",text:"使用作弊、漏洞、机器人、外挂、修改版客户端、脚本或其他未经授权的方式获取优势，或操纵分数、奖励或玩法。"},{lead:"逆向工程：",text:"复制、修改、反编译、反汇编或对本游戏进行逆向工程，适用法律明确允许的除外。"},{lead:"干扰行为：",text:"干扰或破坏本游戏、其服务、服务器、网络，或他人使用这些服务的能力。"},{lead:"冒充：",text:"通过 Google Play 游戏个人资料、显示名称或相关功能冒充他人身份或歪曲您的身份。"}],s3Title:"3. 虚拟物品与货币",s3p1:"金币、皮肤、升级以及本游戏提供的其他虚拟物品仅授权给您使用，而非归您所有。它们不具有现实货币价值，除本游戏明确提供的功能外不可转让，也不能兑换现金或其他对价。",s3p2:"除适用法律或相关应用商店政策要求外，购买一经完成即为最终交易，不予退款。Core Dive Guild 可管理、修改、暂停或移除虚拟物品或货币，包括用于修复错误、处理漏洞利用或维持游戏平衡。",s4Title:"4. 广告",s4Text:"本游戏使用 Google AdMob，并可能提供可选的激励视频广告。成功完成激励广告可能会授予所宣传的游戏内货币或奖励。第三方广告内容由其提供方或广告商负责，Core Dive Guild 不为广告中出现的第三方产品或服务背书。仅对成功完成并经本游戏验证的广告发放奖励。",s5Title:"5. Google Play 游戏服务",s5Text:"登录 Google Play 游戏服务是可选的，但某些功能——如云存档和排行榜——可能需要登录。您对这些服务的使用还受 Google 相关条款和隐私政策约束。与作弊或操纵相关的分数或其他提交内容可能会被移除，相关游戏功能的访问权限可能会受到限制。",s6Title:"6. 知识产权",s6Text:"本游戏及其内容，包括代码、图形、美术、音频、文本、界面、角色及相关材料，归 Core Dive Guild 或其许可方所有，并受相关知识产权法律保护。除第 1 条所述有限许可外，您不获得本游戏或其内容的任何权利。",s7Title:"7. 游戏更新与变更",s7Text:"Core Dive Guild 可随时更新、修改、暂停或终止本游戏或任何功能、内容、虚拟物品或服务，包括出于维护、安全、平衡或商业原因，且无需通知您或承担责任。",s8Title:"8. 保证免责声明",s8Text:"在适用法律允许的最大范围内，本游戏按“现状”和“可用状态”提供，存在一切瑕疵，不作任何明示、默示或法定的保证。Core Dive Guild 不保证本游戏不间断、安全、无错误或兼容所有设备，也不保证已保存的进度永不丢失。",s9Title:"9. 责任限制",s9Text:"在适用法律允许的最大范围内，对于因您使用或无法使用本游戏而产生的任何间接、附带、特殊、后果性或惩罚性损害，或任何进度、虚拟物品、货币或数据的损失，Core Dive Guild 及其许可方概不负责。",s10Title:"10. 终止",s10Text:"如果您违反本条款或滥用本游戏，Core Dive Guild 可暂停或终止您对本游戏或特定功能（包括排行榜和云存档）的访问。您可以随时卸载本游戏以停止使用。第 3、6、8 和 9 条在终止后继续有效，其他按性质应继续有效的条款亦然。",s11Title:"11. 本条款的变更",s11Text:"我们可能不时更新本条款。更新版本将发布在本页面，并附新的“最后更新”日期。在更新条款生效后继续使用本游戏，即表示您接受该条款。",s12Title:"12. 联系我们",s12a:"如果您对本条款有疑问或需要 Core Dive 支持，请通过以下方式联系我们："}},ko:{code:"ko",label:"한국어",meta:{homeTitle:"Core Dive | 버티컬 디센트 로그라이트",privacyTitle:"개인정보처리방침 | Core Dive",termsTitle:"이용약관 | Core Dive",description:"Core Dive —— Core Dive Guild의 버티컬 디센트 로그라이트. 개인정보처리방침, 이용약관 및 플레이어 지원.",langAttr:"ko"},controls:{language:"언어",dark:"다크",light:"라이트",switchToLight:"라이트 테마로 전환",switchToDark:"다크 테마로 전환"},landing:{tagline:"버티컬 디센트 로그라이트",description:"행성 핵까지 깊이 드릴하세요. 끝없는 지하 적들의 웨이브와 싸우고, 함선을 업그레이드하며, 하강에서 살아남으세요. 다이브할 준비가 되셨나요?",privacy:"개인정보처리방침",terms:"이용약관",contact:"고객 지원 문의",footer:"© 2026 Core Dive Guild. 모든 권리 보유."},legal:{updatedPrefix:"최종 업데이트:",date:"2026년 11월 6일",back:"홈으로 돌아가기"},privacy:{title:"Core Dive 개인정보처리방침",intro:"Core Dive Guild(“저희”)은 귀하의 개인정보를 보호하기 위해 최선을 다합니다. 본 개인정보처리방침은 Core Dive 모바일 애플리케이션(“게임”)이 개인정보를 수집, 이용 및 공개하는 방법을 설명합니다.",s1Title:"1. 수집하는 정보",s1Intro:"게임에서 사용하는 정보는 아래 설명된 기능에 필요한 범위로 제한됩니다:",s1Items:[{lead:"Google Play 게임즈 서비스:",text:"로그인하시는 경우, 게임이 Play Games ID, 표시 이름 및 리더보드 점수에 접근할 수 있습니다. 이 정보는 인증, 클라우드 저장 및 순위에 사용됩니다."},{lead:"광고(Google AdMob):",text:"게임은 보상형 동영상 광고를 제공하기 위해 Google AdMob을 사용합니다. AdMob은 맞춤형 또는 비맞춤형 광고 제공, 광고 성과 측정 및 사기 방지를 위해 광고 ID 및 기기 정보를 수집하거나 수신할 수 있습니다."},{lead:"게임 데이터:",text:"코인, 스킨, 업그레이드, 업적을 포함한 진행 상황은 기기에 로컬로 저장되며, Google Play 게임즈 로그인이 활성화된 경우 Google Play 클라우드 저장에 동기화됩니다."}],s2Title:"2. 정보 이용 방법",s2Text:"데이터는 게임을 운영하고 기능을 제공하기 위해서만 사용됩니다. 여기에는 게임플레이 실행, 클라우드 저장 및 진행 동기화, 리더보드 및 순위 유지, 보상형 광고 제공이 포함됩니다. 또한 오류 수정, 게임 오남용 방지 및 지원 요청 응대를 위해 게임플레이 또는 진단 정보를 사용할 수 있습니다.",s3Title:"3. 제3자 공유",s3a:"저희는 귀하의 개인정보를 판매, 거래 또는 임대하지 않습니다. 본 방침에 설명된 데이터 처리에 관여하는 제3자 서비스는 Google 서비스뿐입니다: 로그인, 클라우드 저장 및 리더보드를 위한 Google Play 게임즈 서비스와 광고를 위한 Google AdMob입니다. 해당 서비스가 처리하는 정보에는 다음 정책도 적용됩니다: ",s3Link:"Google 개인정보처리방침",s3b:".",s4Title:"4. 데이터 보관 및 삭제",s4Items:[{lead:"로컬 데이터:",text:"기기에 저장된 게임 데이터는 게임을 제거하거나 앱 데이터를 삭제할 때까지 보관됩니다."},{lead:"클라우드 데이터:",text:"Google Play 계정이 게임에 계속 연결되어 있는 동안 클라우드 저장 데이터가 보관되며, Google의 보관 정책이 적용됩니다."},{lead:"삭제 요청:",text:"게임과 관련된 정보 삭제를 요청하시려면 저희에게 문의하실 수 있습니다. 관련 데이터를 찾고 요청을 확인하기 위해 Play Games ID 또는 기타 합리적인 정보가 필요할 수 있습니다."}],s5Title:"5. 문의하기",s5a:"본 개인정보처리방침에 대한 질문이 있거나 개인정보/삭제 요청을 원하시면 다음 주소로 문의해 주세요:"},terms:{title:"Core Dive 이용약관",intro:"본 이용약관(“약관”)은 Core Dive Guild이 제공하는 Core Dive 모바일 애플리케이션(“게임”)의 이용에 적용됩니다. 게임을 다운로드, 설치, 접속 또는 플레이함으로써 귀하는 본 약관에 동의하게 됩니다. 동의하지 않으시면 게임을 사용하지 마십시오.",s1Title:"1. 게임 이용 라이선스",s1Text:"본 약관 및 게임을 취득한 앱 스토어의 약관을 준수하는 조건으로, Core Dive Guild은 귀하의 개인적 비상업적 오락을 위해 게임을 설치하고 이용할 수 있는 개인적, 비독점적, 양도 불가능하고 취소 가능한 라이선스를 부여합니다. 이 라이선스는 게임 또는 그 콘텐츠에 대한 소유권을 부여하지 않습니다.",s2Title:"2. 사용자 행동",s2Intro:"귀하는 게임, 다른 플레이어 또는 Core Dive Guild을 해치는 행위를 하지 않을 것에 동의합니다. 여기에는 다음이 포함됩니다:",s2Items:[{lead:"부정행위 및 자동화:",text:"치트, 익스플로잇, 봇, 핵, 변조 클라이언트, 스크립트 또는 기타 승인되지 않은 방법을 사용하여 이득을 얻거나 점수, 보상 또는 게임플레이를 조작하는 행위."},{lead:"리버스 엔지니어링:",text:"관련 법률에서 명시적으로 허용하는 경우를 제외하고 게임을 복사, 수정, 디컴파일, 디스어셈블 또는 리버스 엔지니어링하는 행위."},{lead:"방해:",text:"게임, 그 서비스, 서버, 네트워크 또는 타인의 이용 능력을 방해하거나 중단시키는 행위."},{lead:"사칭:",text:"Google Play 게임즈 프로필, 표시 이름 또는 관련 기능을 통해 신원을 허위로 표시하거나 타인을 사칭하는 행위."}],s3Title:"3. 가상 아이템 및 재화",s3p1:"코인, 스킨, 업그레이드 및 게임에서 제공되는 기타 가상 아이템은 귀하에게 라이선스가 부여되는 것이며, 귀하의 소유가 아닙니다. 현실 세계의 금전적 가치가 없으며, 게임이 명시적으로 제공하는 기능을 통하지 않고는 양도할 수 없고, 현금이나 다른 대가로 교환할 수 없습니다.",s3p2:"관련 법률 또는 앱 스토어 정책에서 요구하는 경우를 제외하고 구매는 최종적이며 환불되지 않습니다. Core Dive Guild은 오류 수정, 익스플로잇 대응 또는 게임 밸런스 유지를 포함하여 가상 아이템이나 재화를 관리, 수정, 중지 또는 제거할 수 있습니다.",s4Title:"4. 광고",s4Text:"게임은 Google AdMob을 사용하며 선택적 보상형 동영상 광고를 제공할 수 있습니다. 보상형 광고를 성공적으로 완료하면 광고된 게임 내 재화 또는 보상이 지급될 수 있습니다. 제3자 광고 콘텐츠는 해당 제공자 또는 광고주의 책임이며, Core Dive Guild은 광고에 표시되는 제3자 제품이나 서비스를 보증하지 않습니다. 보상은 성공적으로 완료되고 게임에서 검증된 광고에 대해서만 지급됩니다.",s5Title:"5. Google Play 게임즈 서비스",s5Text:"Google Play 게임즈 서비스 로그인은 선택 사항이지만, 클라우드 저장 및 리더보드와 같은 일부 기능은 로그인이 필요할 수 있습니다. 해당 서비스 이용에는 Google의 관련 약관 및 개인정보처리방침도 적용됩니다. 부정행위나 조작과 관련된 점수 또는 제출물은 삭제될 수 있으며, 관련 게임 기능 접근이 제한될 수 있습니다.",s6Title:"6. 지적재산권",s6Text:"코드, 그래픽, 아트워크, 오디오, 텍스트, 인터페이스, 캐릭터 및 관련 자료를 포함한 게임과 그 콘텐츠는 Core Dive Guild 또는 그 라이선스 제공자가 소유하며 관련 지적재산권법의 보호를 받습니다. 귀하는 제1조에 설명된 제한적 라이선스 외에 게임이나 그 콘텐츠에 대한 어떠한 권리도 취득하지 않습니다.",s7Title:"7. 게임 업데이트 및 변경",s7Text:"Core Dive Guild은 유지보수, 보안, 밸런싱 또는 사업상의 이유를 포함하여 언제든지 게임 또는 기능, 콘텐츠, 가상 아이템, 서비스를 업데이트, 수정, 중단 또는 종료할 수 있으며, 이에 대해 귀하에게 통지하거나 책임을 지지 않습니다.",s8Title:"8. 보증의 부인",s8Text:"관련 법률이 허용하는 최대 범위 내에서 게임은 “있는 그대로” 및 “이용 가능한 상태로”, 모든 하자와 함께 제공되며, 명시적, 묵시적 또는 법정 여부를 불문하고 어떠한 보증도 하지 않습니다. Core Dive Guild은 게임이 중단 없이, 안전하게, 오류 없이 제공되거나 모든 기기와 호환될 것, 또는 저장된 진행 상황이 절대 손실되지 않을 것을 보장하지 않습니다.",s9Title:"9. 책임의 제한",s9Text:"관련 법률이 허용하는 최대 범위 내에서, 귀하의 게임 이용 또는 이용 불능으로 인해 발생하거나 이와 관련된 간접적, 부수적, 특별, 결과적 또는 징벌적 손해, 또는 진행 상황, 가상 아이템, 재화 또는 데이터의 손실에 대해 Core Dive Guild 및 그 라이선스 제공자는 책임을 지지 않습니다.",s10Title:"10. 해지",s10Text:"귀하가 본 약관을 위반하거나 게임을 오용하는 경우 Core Dive Guild은 리더보드 및 클라우드 저장을 포함한 게임 또는 특정 기능에 대한 귀하의 접근을 중지하거나 해지할 수 있습니다. 귀하는 언제든지 게임을 제거함으로써 이용을 중단할 수 있습니다. 제3조, 제6조, 제8조 및 제9조는 해지 후에도 존속하며, 그 성격상 존속해야 하는 조항도 함께 존속합니다.",s11Title:"11. 본 약관의 변경",s11Text:"저희는 수시로 본 약관을 업데이트할 수 있습니다. 업데이트된 버전은 새로운 “최종 업데이트” 날짜와 함께 이 페이지에 게시됩니다. 업데이트된 약관이 발효된 후에도 게임을 계속 이용하면 해당 약관에 동의한 것으로 간주됩니다.",s12Title:"12. 문의하기",s12a:"본 약관에 대한 질문이 있거나 Core Dive 지원이 필요하시면 다음 주소로 문의해 주세요:"}},ja:{code:"ja",label:"日本語",meta:{homeTitle:"Core Dive | 垂直下降ローグライト",privacyTitle:"プライバシーポリシー | Core Dive",termsTitle:"利用規約 | Core Dive",description:"Core Dive —— Core Dive Guildによる垂直下降ローグライト。プライバシーポリシー、利用規約、プレイヤーサポート。",langAttr:"ja"},controls:{language:"言語",dark:"ダーク",light:"ライト",switchToLight:"ライトテーマに切り替え",switchToDark:"ダークテーマに切り替え"},landing:{tagline:"垂直下降ローグライト",description:"惑星のコアまで深く掘り進もう。無限に押し寄せる地下エネミーと戦い、シップをアップグレードして、降下を生き延びよう。ダイブの準備はできたか？",privacy:"プライバシーポリシー",terms:"利用規約",contact:"サポートに連絡",footer:"© 2026 Core Dive Guild. すべての権利を保有します。"},legal:{updatedPrefix:"最終更新：",date:"2026年11月6日",back:"ホームに戻る"},privacy:{title:"Core Dive プライバシーポリシー",intro:"Core Dive Guild（「当社」）は、お客様のプライバシー保護に取り組んでいます。本プライバシーポリシーは、Core Dive モバイルアプリケーション（「本ゲーム」）における個人情報の収集、利用、開示について説明します。",s1Title:"1. 収集する情報",s1Intro:"本ゲームで利用する情報は、以下に説明する機能に必要な範囲に限定されます：",s1Items:[{lead:"Google Play ゲームサービス：",text:"ログインを選択した場合、本ゲームはPlay Games ID、表示名、リーダーボードのスコアにアクセスすることがあります。これらの情報は、認証、クラウドセーブ、ランキングに使用されます。"},{lead:"広告（Google AdMob）：",text:"本ゲームはリワード動画広告の提供にGoogle AdMobを使用しています。AdMobは、パーソナライズ広告または非パーソナライズ広告の配信、広告効果の測定、不正防止のため、広告IDやデバイス情報を収集または受信することがあります。"},{lead:"ゲームデータ：",text:"コイン、スキン、アップグレード、実績などの進行状況はお客様のデバイスにローカル保存され、Google Play ゲームへのログインが有効な場合はGoogle Play クラウドセーブに同期されます。"}],s2Title:"2. 情報の利用方法",s2Text:"データは、本ゲームの運営および機能提供のためにのみ使用されます。これには、ゲームプレイの実行、クラウドセーブや進行状況の同期、リーダーボードやランキングの維持、リワード広告の配信が含まれます。また、エラーの修正、本ゲームの不正利用防止、サポートリクエストへの対応のため、ゲームプレイ情報や診断情報を使用することがあります。",s3Title:"3. 第三者への共有",s3a:"当社はお客様の個人情報を販売、取引、賃貸することはありません。本ポリシーに記載されたデータ処理に関与する第三者サービスはGoogleのサービスのみです：ログイン、クラウドセーブ、リーダーボードのためのGoogle Play ゲームサービスと、広告のためのGoogle AdMobです。これらのサービスが処理する情報には、以下も適用されます：",s3Link:"Google プライバシーポリシー",s3b:"。",s4Title:"4. データの保持と削除",s4Items:[{lead:"ローカルデータ：",text:"デバイスに保存されたゲームデータは、本ゲームをアンインストールするか、アプリデータを消去するまで保持されます。"},{lead:"クラウドデータ：",text:"Google Play アカウントが本ゲームに引き続き連携されている間、クラウドセーブデータは保持され、Google独自の保持方針が適用されます。"},{lead:"削除リクエスト：",text:"本ゲームに関連する情報の削除をご希望の場合は、当社までご連絡いただけます。関連データの特定とリクエストの確認のため、Play Games IDなどの合理的な情報が必要になる場合があります。"}],s5Title:"5. お問い合わせ",s5a:"本プライバシーポリシーに関するご質問、またはプライバシー／削除のリクエストについては、以下までご連絡ください："},terms:{title:"Core Dive 利用規約",intro:"本利用規約（「本規約」）は、Core Dive Guildが提供するCore Dive モバイルアプリケーション（「本ゲーム」）の利用に適用されます。本ゲームをダウンロード、インストール、アクセス、またはプレイすることにより、お客様は本規約に同意したものとみなされます。同意いただけない場合は、本ゲームを使用しないでください。",s1Title:"1. 本ゲームの利用ライセンス",s1Text:"本規約および本ゲームを取得したアプリストアの規約に従うことを条件として、Core Dive Guildは、お客様の個人的かつ非営利の娯楽のために本ゲームをインストールおよび利用できる、個人的、非独占的、譲渡不可、取消可能なライセンスを付与します。このライセンスは、本ゲームまたはそのコンテンツの所有権を付与するものではありません。",s2Title:"2. ユーザーの行為",s2Intro:"お客様は、本ゲーム、他のプレイヤー、またはCore Dive Guildを害する行為を行わないことに同意します。これには以下が含まれます：",s2Items:[{lead:"チートおよび自動化：",text:"チート、エクスプロイト、ボット、ハック、改変クライアント、スクリプト、その他の未承認の方法を使用して優位に立つこと、またはスコア、報酬、ゲームプレイを操作すること。"},{lead:"リバースエンジニアリング：",text:"適用法令で明示的に許可される場合を除き、本ゲームを複製、改変、逆コンパイル、逆アセンブル、またはリバースエンジニアリングすること。"},{lead:"妨害：",text:"本ゲーム、そのサービス、サーバー、ネットワーク、または他者の利用を妨害もしくは中断すること。"},{lead:"なりすまし：",text:"Google Play ゲームのプロフィール、表示名、または関連機能を通じて、身元を偽ったり他人になりすましたりすること。"}],s3Title:"3. 仮想アイテムおよび通貨",s3p1:"コイン、スキン、アップグレード、その他本ゲームで提供される仮想アイテムは、お客様にライセンスされるものであり、お客様が所有するものではありません。現実世界の金銭的価値はなく、本ゲームが明示的に提供する機能以外では譲渡できず、現金やその他の対価と交換することはできません。",s3p2:"適用法令または関連アプリストアのポリシーで要求される場合を除き、購入は確定であり返金されません。Core Dive Guildは、エラーの修正、エクスプロイトへの対応、ゲームバランスの維持などを含む目的で、仮想アイテムや通貨を管理、変更、一時停止、または削除することがあります。",s4Title:"4. 広告",s4Text:"本ゲームはGoogle AdMobを使用し、任意のリワード動画広告を提供する場合があります。リワード広告を正常に完了すると、宣伝されたゲーム内通貨や報酬が付与される場合があります。第三者の広告コンテンツは、その提供者または広告主の責任であり、Core Dive Guildは広告に表示される第三者の製品やサービスを推奨するものではありません。報酬は、正常に完了し、本ゲームによって検証された広告に対してのみ付与されます。",s5Title:"5. Google Play ゲームサービス",s5Text:"Google Play ゲームサービスへのログインは任意ですが、クラウドセーブやリーダーボードなどの一部機能にはログインが必要な場合があります。これらのサービスの利用には、Googleの関連規約およびプライバシーポリシーも適用されます。不正行為や操作に関連するスコアその他の送信内容は削除される場合があり、関連するゲーム機能へのアクセスが制限される場合があります。",s6Title:"6. 知的財産権",s6Text:"コード、グラフィック、アートワーク、オーディオ、テキスト、インターフェース、キャラクターおよび関連資料を含む本ゲームとそのコンテンツは、Core Dive Guildまたはそのライセンサーが所有し、関連する知的財産法によって保護されています。お客様は、第1条に記載された限定的なライセンスを超えて、本ゲームまたはそのコンテンツに関するいかなる権利も取得しません。",s7Title:"7. 本ゲームの更新および変更",s7Text:"Core Dive Guildは、メンテナンス、セキュリティ、バランス調整、事業上の理由などにより、事前の通知や責任を負うことなく、いつでも本ゲームまたは機能、コンテンツ、仮想アイテム、サービスを更新、変更、一時停止、または終了することがあります。",s8Title:"8. 保証の免責",s8Text:"適用法令で認められる最大限の範囲において、本ゲームは「現状有姿」および「利用可能な状態」で、一切の瑕疵とともに提供され、明示、黙示、法定を問わず、いかなる保証も行いません。Core Dive Guildは、本ゲームが中断なく、安全に、エラーなく提供されること、すべてのデバイスと互換性があること、または保存された進行状況が決して失われないことを保証しません。",s9Title:"9. 責任の制限",s9Text:"適用法令で認められる最大限の範囲において、お客様による本ゲームの利用または利用不能に起因もしくは関連する間接的、付随的、特別、結果的または懲罰的損害、ならびに進行状況、仮想アイテム、通貨またはデータの損失について、Core Dive Guildおよびそのライセンサーは責任を負いません。",s10Title:"10. 終了",s10Text:"お客様が本規約に違反した場合や本ゲームを不正利用した場合、Core Dive Guildは、リーダーボードやクラウドセーブを含む本ゲームまたは特定機能へのお客様のアクセスを一時停止または終了することがあります。お客様は、本ゲームをアンインストールすることにより、いつでも利用を終了できます。第3条、第6条、第8条および第9条は終了後も存続し、性質上存続すべき条項も同様に存続します。",s11Title:"11. 本規約の変更",s11Text:"当社は、本規約を随時更新することがあります。更新版は、新しい「最終更新」日とともに本ページに掲載されます。更新後の規約の発効後に本ゲームの利用を継続することは、当該規約への同意を意味します。",s12Title:"12. お問い合わせ",s12a:"本規約に関するご質問やCore Diveのサポートが必要な場合は、以下までご連絡ください："}},de:{code:"de",label:"Deutsch",meta:{homeTitle:"Core Dive | Vertikales Abstiegs-Roguelite",privacyTitle:"Datenschutzerklärung | Core Dive",termsTitle:"Nutzungsbedingungen | Core Dive",description:"Core Dive — ein vertikales Abstiegs-Roguelite von Core Dive Guild. Datenschutzerklärung, Nutzungsbedingungen und Spieler-Support.",langAttr:"de"},controls:{language:"Sprache",dark:"Dunkel",light:"Hell",switchToLight:"Zum hellen Theme wechseln",switchToDark:"Zum dunklen Theme wechseln"},landing:{tagline:"Vertikales Abstiegs-Roguelite",description:"Bohre dich tief in den Planetenkern. Kämpfe gegen endlose Wellen unterirdischer Feinde, rüste dein Schiff auf und überlebe den Abstieg. Bist du bereit für den Dive?",privacy:"Datenschutzerklärung",terms:"Nutzungsbedingungen",contact:"Support Kontaktieren",footer:"© 2026 Core Dive Guild. Alle Rechte vorbehalten."},legal:{updatedPrefix:"Zuletzt Aktualisiert:",date:"6. November 2026",back:"Zurück zur Startseite"},privacy:{title:"Datenschutzerklärung für Core Dive",intro:"Core Dive Guild („wir“, „uns“ oder „unser“) setzt sich für den Schutz Ihrer Privatsphäre ein. Diese Datenschutzerklärung erläutert, wie personenbezogene Daten durch die mobile Anwendung Core Dive (das „Spiel“) erhoben, verwendet und offengelegt werden.",s1Title:"1. Informationen, die wir erheben",s1Intro:"Wir beschränken die vom Spiel verwendeten Informationen auf das für die unten beschriebenen Funktionen Erforderliche:",s1Items:[{lead:"Google Play Spiele-Dienste:",text:"Wenn Sie sich anmelden, kann das Spiel auf Ihre Play Games-ID, Ihren Anzeigenamen und Ihre Bestenlisten-Ergebnisse zugreifen. Diese Informationen werden zur Authentifizierung, für Cloud-Speicherstände und Ranglisten verwendet."},{lead:"Werbung (Google AdMob):",text:"Das Spiel verwendet Google AdMob zur Bereitstellung von Rewarded-Videoanzeigen. AdMob kann Ihre Werbe-ID und Geräteinformationen erheben oder erhalten, um personalisierte oder nicht personalisierte Werbung bereitzustellen, die Anzeigenleistung zu messen und Betrug zu verhindern."},{lead:"Spieldaten:",text:"Ihr Fortschritt – einschließlich Münzen, Skins, Upgrades und Erfolge – wird lokal auf Ihrem Gerät gespeichert und, wenn die Anmeldung bei Google Play Spiele aktiviert ist, mit Google Play Cloud-Speicherständen synchronisiert."}],s2Title:"2. Wie wir Ihre Informationen verwenden",s2Text:"Daten werden ausschließlich zum Betrieb des Spiels und zur Bereitstellung seiner Funktionen verwendet. Dazu gehören die Ausführung des Gameplays, Cloud-Speicherung und Fortschrittssynchronisierung, die Pflege von Bestenlisten und Ranglisten sowie die Bereitstellung von Rewarded Ads. Wir können Gameplay- oder Diagnoseinformationen auch zur Fehlerbehebung, zum Schutz des Spiels vor Missbrauch und zur Beantwortung von Supportanfragen verwenden.",s3Title:"3. Weitergabe an Dritte",s3a:"Wir verkaufen, handeln oder vermieten Ihre personenbezogenen Daten nicht. Die einzigen Drittanbieterdienste, die an den in dieser Richtlinie beschriebenen Datenverarbeitungen beteiligt sind, sind Google-Dienste: Google Play Spiele-Dienste für Anmeldung, Cloud-Speicherstände und Bestenlisten sowie Google AdMob für Werbung. Für die von diesen Diensten verarbeiteten Informationen gilt außerdem die ",s3Link:"Google-Datenschutzerklärung",s3b:".",s4Title:"4. Datenspeicherung und Löschung",s4Items:[{lead:"Lokale Daten:",text:"Auf Ihrem Gerät gespeicherte Spieldaten werden aufbewahrt, bis Sie das Spiel deinstallieren oder die App-Daten löschen."},{lead:"Cloud-Daten:",text:"Cloud-Speicherdaten werden aufbewahrt, solange Ihr Google Play-Konto mit dem Spiel verknüpft bleibt, vorbehaltlich der eigenen Aufbewahrungspraktiken von Google."},{lead:"Löschanfragen:",text:"Sie können uns kontaktieren, um die Löschung von mit dem Spiel verbundenen Informationen zu beantragen. Möglicherweise benötigen wir Ihre Play Games-ID oder andere angemessene Angaben, um die relevanten Daten zu finden und die Anfrage zu verifizieren."}],s5Title:"5. Kontakt",s5a:"Wenn Sie Fragen zu dieser Datenschutzerklärung haben oder eine Datenschutz-/Löschanfrage stellen möchten, kontaktieren Sie uns unter:"},terms:{title:"Nutzungsbedingungen für Core Dive",intro:"Diese Nutzungsbedingungen (die „Bedingungen“) regeln Ihre Nutzung der mobilen Anwendung Core Dive (das „Spiel“), bereitgestellt von Core Dive Guild. Durch das Herunterladen, Installieren, Aufrufen oder Spielen des Spiels stimmen Sie diesen Bedingungen zu. Wenn Sie nicht zustimmen, nutzen Sie das Spiel nicht.",s1Title:"1. Lizenz zur Nutzung des Spiels",s1Text:"Vorbehaltlich dieser Bedingungen und der Bedingungen des App-Stores, aus dem Sie das Spiel bezogen haben, gewährt Ihnen Core Dive Guild eine persönliche, nicht-exklusive, nicht übertragbare, widerrufliche Lizenz zur Installation und Nutzung des Spiels zu Ihrem eigenen persönlichen, nicht-kommerziellen Unterhaltungszweck. Diese Lizenz begründet kein Eigentum am Spiel oder dessen Inhalten.",s2Title:"2. Nutzerverhalten",s2Intro:"Sie verpflichten sich, keine Handlungen vorzunehmen, die das Spiel, andere Spieler oder Core Dive Guild beeinträchtigen, einschließlich:",s2Items:[{lead:"Cheaten und Automatisierung:",text:"Verwendung von Cheats, Exploits, Bots, Hacks, modifizierten Clients, Skripten oder anderen nicht autorisierten Methoden, um sich einen Vorteil zu verschaffen oder Punktestände, Belohnungen oder Gameplay zu manipulieren."},{lead:"Reverse Engineering:",text:"Kopieren, Ändern, Dekompilieren, Disassemblieren oder Reverse Engineering des Spiels, außer soweit dies nach geltendem Recht ausdrücklich zulässig ist."},{lead:"Störung:",text:"Beeinträchtigung oder Störung des Spiels, seiner Dienste, Server, Netzwerke oder der Nutzungsmöglichkeit anderer Personen."},{lead:"Identitätsmissbrauch:",text:"Falsche Darstellung Ihrer Identität oder Nachahmung einer anderen Person über Google Play Spiele-Profile, Anzeigenamen oder zugehörige Funktionen."}],s3Title:"3. Virtuelle Gegenstände und Währung",s3p1:"Münzen, Skins, Upgrades und andere im Spiel verfügbare virtuelle Gegenstände werden Ihnen lizenziert, nicht übereignet. Sie haben keinen realen Geldwert, sind außerhalb der ausdrücklich vom Spiel bereitgestellten Funktionen nicht übertragbar und können nicht gegen Bargeld oder andere Gegenleistungen eingetauscht werden.",s3p2:"Käufe sind endgültig und nicht erstattungsfähig, außer soweit dies nach geltendem Recht oder den Richtlinien des jeweiligen App-Stores erforderlich ist. Core Dive Guild kann virtuelle Gegenstände oder Währung verwalten, ändern, aussetzen oder entfernen, unter anderem zur Fehlerkorrektur, zur Behebung von Exploits oder zur Wahrung der Spielbalance.",s4Title:"4. Werbung",s4Text:"Das Spiel verwendet Google AdMob und bietet möglicherweise optionale Rewarded-Videoanzeigen an. Eine erfolgreich abgeschlossene Rewarded-Anzeige kann die beworbene Spielwährung oder Belohnung gewähren. Inhalte von Drittanbieterwerbung liegen in der Verantwortung des jeweiligen Anbieters oder Werbetreibenden, und Core Dive Guild befürwortet keine in Anzeigen gezeigten Produkte oder Dienste Dritter. Belohnungen werden nur für erfolgreich abgeschlossene und vom Spiel validierte Anzeigen gewährt.",s5Title:"5. Google Play Spiele-Dienste",s5Text:"Die Anmeldung bei den Google Play Spiele-Diensten ist optional, für einige Funktionen – wie Cloud-Speicherung und Bestenlisten – jedoch möglicherweise erforderlich. Für Ihre Nutzung dieser Dienste gelten außerdem die anwendbaren Bedingungen und Datenschutzrichtlinien von Google. Punktestände oder andere Einreichungen im Zusammenhang mit Betrug oder Manipulation können entfernt und der Zugang zu entsprechenden Spielfunktionen eingeschränkt werden.",s6Title:"6. Geistiges Eigentum",s6Text:"Das Spiel und seine Inhalte, einschließlich Code, Grafiken, Artworks, Audio, Text, Oberflächen, Charaktere und zugehöriger Materialien, sind Eigentum von Core Dive Guild oder seiner Lizenzgeber und durch geltende Gesetze zum geistigen Eigentum geschützt. Sie erhalten keine Rechte am Spiel oder dessen Inhalten über die in Abschnitt 1 beschriebene eingeschränkte Lizenz hinaus.",s7Title:"7. Updates und Änderungen am Spiel",s7Text:"Core Dive Guild kann das Spiel oder Funktionen, Inhalte, virtuelle Gegenstände oder Dienste jederzeit aktualisieren, ändern, aussetzen oder einstellen, unter anderem aus Wartungs-, Sicherheits-, Balancing- oder geschäftlichen Gründen, ohne Ankündigung oder Haftung Ihnen gegenüber.",s8Title:"8. Gewährleistungsausschluss",s8Text:"Soweit nach geltendem Recht maximal zulässig, wird das Spiel „wie besehen“ und „wie verfügbar“, mit allen Fehlern und ohne Gewährleistungen jeglicher Art, ob ausdrücklich, stillschweigend oder gesetzlich, bereitgestellt. Core Dive Guild garantiert nicht, dass das Spiel unterbrechungsfrei, sicher, fehlerfrei oder mit jedem Gerät kompatibel ist oder dass gespeicherte Fortschritte niemals verloren gehen.",s9Title:"9. Haftungsbeschränkung",s9Text:"Soweit nach geltendem Recht maximal zulässig, haften Core Dive Guild und seine Lizenzgeber nicht für indirekte, zufällige, besondere, Folge- oder Strafschäden oder für Verluste von Fortschritten, virtuellen Gegenständen, Währung oder Daten, die sich aus Ihrer Nutzung oder Unmöglichkeit der Nutzung des Spiels ergeben oder damit zusammenhängen.",s10Title:"10. Kündigung",s10Text:"Core Dive Guild kann Ihren Zugang zum Spiel oder zu bestimmten Funktionen, einschließlich Bestenlisten und Cloud-Speicherung, aussetzen oder beenden, wenn Sie gegen diese Bedingungen verstoßen oder das Spiel missbrauchen. Sie können die Nutzung des Spiels jederzeit durch Deinstallation beenden. Die Abschnitte 3, 6, 8 und 9 bleiben nach Beendigung bestehen, ebenso alle Bestimmungen, die ihrer Natur nach fortgelten sollten.",s11Title:"11. Änderungen dieser Bedingungen",s11Text:"Wir können diese Bedingungen von Zeit zu Zeit aktualisieren. Jede aktualisierte Fassung wird mit einem neuen Datum „Zuletzt aktualisiert“ auf dieser Seite veröffentlicht. Ihre fortgesetzte Nutzung des Spiels nach Inkrafttreten aktualisierter Bedingungen gilt als Annahme dieser Bedingungen.",s12Title:"12. Kontakt",s12a:"Wenn Sie Fragen zu diesen Bedingungen haben oder Unterstützung für Core Dive benötigen, kontaktieren Sie uns unter:"}},fr:{code:"fr",label:"Français",meta:{homeTitle:"Core Dive | Roguelite de Descente Verticale",privacyTitle:"Politique de Confidentialité | Core Dive",termsTitle:"Conditions d'Utilisation | Core Dive",description:"Core Dive — un roguelite de descente verticale par Core Dive Guild. Politique de confidentialité, conditions d'utilisation et assistance.",langAttr:"fr"},controls:{language:"Langue",dark:"Sombre",light:"Clair",switchToLight:"Passer au thème clair",switchToDark:"Passer au thème sombre"},landing:{tagline:"Roguelite de Descente Verticale",description:"Forez jusqu'au cœur de la planète. Affrontez des vagues infinies d'ennemis souterrains, améliorez votre vaisseau et survivez à la descente. Prêt pour la plongée ?",privacy:"Politique de Confidentialité",terms:"Conditions d'Utilisation",contact:"Contacter l'Assistance",footer:"© 2026 Core Dive Guild. Tous droits réservés."},legal:{updatedPrefix:"Dernière Mise à Jour :",date:"6 novembre 2026",back:"Retour à l'Accueil"},privacy:{title:"Politique de Confidentialité de Core Dive",intro:"Core Dive Guild (« nous ») s'engage à protéger votre vie privée. Cette Politique de Confidentialité explique comment les informations personnelles sont collectées, utilisées et divulguées par l'application mobile Core Dive (le « Jeu »).",s1Title:"1. Informations que Nous Collectons",s1Intro:"Nous limitons les informations utilisées par le Jeu à ce qui est nécessaire pour les fonctionnalités décrites ci-dessous :",s1Items:[{lead:"Services Google Play Jeux :",text:"Si vous choisissez de vous connecter, le Jeu peut accéder à votre identifiant Play Games, votre pseudo et vos scores de classement. Ces informations sont utilisées pour l'authentification, la sauvegarde cloud et les classements."},{lead:"Publicité (Google AdMob) :",text:"Le Jeu utilise Google AdMob pour proposer des publicités vidéo avec récompense. AdMob peut collecter ou recevoir votre identifiant publicitaire et des informations sur l'appareil afin de diffuser des annonces personnalisées ou non personnalisées, de mesurer les performances publicitaires et d'aider à prévenir la fraude."},{lead:"Données de Jeu :",text:"Votre progression — y compris Pièces, Skins, Améliorations et Succès — est stockée localement sur votre appareil et, lorsque la connexion Google Play Jeux est activée, synchronisée avec la sauvegarde cloud Google Play."}],s2Title:"2. Comment Nous Utilisons Vos Informations",s2Text:"Les données sont utilisées strictement pour faire fonctionner le Jeu et fournir ses fonctionnalités. Cela comprend l'exécution du gameplay, la sauvegarde cloud et la synchronisation de la progression, le maintien des classements, ainsi que la diffusion de publicités avec récompense. Nous pouvons également utiliser des informations de jeu ou de diagnostic pour corriger des erreurs, protéger le Jeu contre les abus et répondre aux demandes d'assistance.",s3Title:"3. Partage avec des Tiers",s3a:"Nous ne vendons, n'échangeons ni ne louons vos informations personnelles. Les seuls services tiers impliqués dans les pratiques de données décrites dans cette politique sont les services Google : les Services Google Play Jeux pour la connexion, les sauvegardes cloud et les classements, et Google AdMob pour la publicité. Les informations traitées par ces services sont également soumises aux ",s3Link:"Règles de confidentialité de Google",s3b:".",s4Title:"4. Conservation et Suppression des Données",s4Items:[{lead:"Données locales :",text:"Les données de jeu stockées sur votre appareil sont conservées jusqu'à ce que vous désinstalliez le Jeu ou effaciez les données de l'application."},{lead:"Données cloud :",text:"Les données de sauvegarde cloud sont conservées tant que votre compte Google Play reste lié au Jeu, sous réserve des pratiques de conservation propres à Google."},{lead:"Demandes de suppression :",text:"Vous pouvez nous contacter pour demander la suppression des informations associées au Jeu. Nous pourrions avoir besoin de votre identifiant Play Games ou d'autres informations raisonnables pour localiser les données concernées et vérifier la demande."}],s5Title:"5. Nous Contacter",s5a:"Si vous avez des questions sur cette Politique de Confidentialité ou si vous souhaitez formuler une demande de confidentialité/suppression, contactez-nous à :"},terms:{title:"Conditions d'Utilisation de Core Dive",intro:"Les présentes Conditions d'Utilisation (les « Conditions ») régissent votre utilisation de l'application mobile Core Dive (le « Jeu ») fournie par Core Dive Guild. En téléchargeant, installant, accédant au Jeu ou en y jouant, vous acceptez ces Conditions. Si vous n'êtes pas d'accord, n'utilisez pas le Jeu.",s1Title:"1. Licence d'Utilisation du Jeu",s1Text:"Sous réserve des présentes Conditions et des conditions de la boutique d'applications depuis laquelle vous avez obtenu le Jeu, Core Dive Guild vous accorde une licence personnelle, non exclusive, non transférable et révocable pour installer et utiliser le Jeu à des fins de divertissement personnel et non commercial. Cette licence ne vous confère aucune propriété sur le Jeu ni sur son contenu.",s2Title:"2. Conduite des Utilisateurs",s2Intro:"Vous acceptez de ne pas adopter de comportement portant atteinte au Jeu, aux autres joueurs ou à Core Dive Guild, notamment :",s2Items:[{lead:"Triche et automatisation :",text:"Utilisation de triches, d'exploits, de bots, de hacks, de clients modifiés, de scripts ou d'autres méthodes non autorisées pour obtenir un avantage ou manipuler les scores, les récompenses ou le gameplay."},{lead:"Ingénierie inverse :",text:"Copie, modification, décompilation, désassemblage ou ingénierie inverse du Jeu, sauf lorsque cette activité est expressément autorisée par la loi applicable."},{lead:"Perturbation :",text:"Interférence avec le Jeu, ses services, serveurs, réseaux ou la capacité d'autrui à les utiliser, ou perturbation de ceux-ci."},{lead:"Usurpation d'identité :",text:"Fausse représentation de votre identité ou usurpation de l'identité d'autrui via les profils, pseudos ou fonctionnalités associées de Google Play Jeux."}],s3Title:"3. Objets Virtuels et Monnaie",s3p1:"Les Pièces, Skins, Améliorations et autres objets virtuels proposés dans le Jeu vous sont concédés sous licence, et non cédés. Ils n'ont aucune valeur monétaire réelle, ne sont pas transférables en dehors des fonctionnalités expressément prévues par le Jeu et ne peuvent être échangés contre des espèces ou une autre contrepartie.",s3p2:"Les achats sont définitifs et non remboursables, sauf lorsque la loi applicable ou les politiques de la boutique d'applications concernée l'exigent. Core Dive Guild peut gérer, modifier, suspendre ou supprimer des objets virtuels ou de la monnaie, notamment pour corriger des erreurs, traiter des exploits ou préserver l'équilibre du jeu.",s4Title:"4. Publicités",s4Text:"Le Jeu utilise Google AdMob et peut proposer des publicités vidéo avec récompense facultatives. Une publicité avec récompense correctement terminée peut octroyer la monnaie ou la récompense en jeu annoncée. Le contenu publicitaire tiers relève de la responsabilité de son fournisseur ou annonceur, et Core Dive Guild ne cautionne pas les produits ou services tiers présentés dans les publicités. Les récompenses ne sont accordées que pour les publicités correctement terminées et validées par le Jeu.",s5Title:"5. Services Google Play Jeux",s5Text:"La connexion aux Services Google Play Jeux est facultative, mais certaines fonctionnalités — telles que la sauvegarde cloud et les classements — peuvent l'exiger. Votre utilisation de ces services est également régie par les conditions et politiques de confidentialité applicables de Google. Les scores ou autres soumissions associés à de la triche ou à de la manipulation peuvent être supprimés, et l'accès aux fonctionnalités concernées peut être restreint.",s6Title:"6. Propriété Intellectuelle",s6Text:"Le Jeu et son contenu, y compris le code, les graphismes, les illustrations, l'audio, le texte, les interfaces, les personnages et les éléments associés, appartiennent à Core Dive Guild ou à ses concédants et sont protégés par les lois applicables en matière de propriété intellectuelle. Vous n'obtenez aucun droit sur le Jeu ou son contenu au-delà de la licence limitée décrite à la Section 1.",s7Title:"7. Mises à Jour et Modifications du Jeu",s7Text:"Core Dive Guild peut mettre à jour, modifier, suspendre ou interrompre le Jeu ou toute fonctionnalité, contenu, objet virtuel ou service à tout moment, notamment pour des raisons de maintenance, de sécurité, d'équilibrage ou commerciales, sans préavis ni responsabilité envers vous.",s8Title:"8. Exclusion de Garanties",s8Text:"Dans toute la mesure permise par la loi applicable, le Jeu est fourni « en l'état » et « selon disponibilité », avec tous ses défauts et sans garantie d'aucune sorte, expresse, implicite ou légale. Core Dive Guild ne garantit pas que le Jeu sera ininterrompu, sécurisé, sans erreur ou compatible avec tous les appareils, ni que la progression sauvegardée ne sera jamais perdue.",s9Title:"9. Limitation de Responsabilité",s9Text:"Dans toute la mesure permise par la loi applicable, Core Dive Guild et ses concédants ne seront pas responsables des dommages indirects, accessoires, spéciaux, consécutifs ou punitifs, ni de toute perte de progression, d'objets virtuels, de monnaie ou de données, découlant de ou liés à votre utilisation ou à votre impossibilité d'utiliser le Jeu.",s10Title:"10. Résiliation",s10Text:"Core Dive Guild peut suspendre ou résilier votre accès au Jeu ou à certaines fonctionnalités, y compris les classements et la sauvegarde cloud, si vous enfreignez ces Conditions ou utilisez le Jeu de manière abusive. Vous pouvez cesser d'utiliser le Jeu à tout moment en le désinstallant. Les Sections 3, 6, 8 et 9 survivent à la résiliation, ainsi que toute disposition qui par nature devrait survivre.",s11Title:"11. Modifications des Présentes Conditions",s11Text:"Nous pouvons mettre à jour ces Conditions de temps à autre. Toute version mise à jour sera publiée sur cette page avec une nouvelle date de « Dernière mise à jour ». Votre utilisation continue du Jeu après l'entrée en vigueur des Conditions mises à jour vaut acceptation de ces Conditions.",s12Title:"12. Nous Contacter",s12a:"Si vous avez des questions sur ces Conditions ou besoin d'assistance pour Core Dive, contactez-nous à :"}},es:{code:"es",label:"Español",meta:{homeTitle:"Core Dive | Roguelite de Descenso Vertical",privacyTitle:"Política de Privacidad | Core Dive",termsTitle:"Términos del Servicio | Core Dive",description:"Core Dive — un roguelite de descenso vertical de Core Dive Guild. Política de privacidad, términos del servicio y asistencia.",langAttr:"es"},controls:{language:"Idioma",dark:"Oscuro",light:"Claro",switchToLight:"Cambiar al tema claro",switchToDark:"Cambiar al tema oscuro"},landing:{tagline:"Roguelite de Descenso Vertical",description:"Perfora hasta el núcleo del planeta. Lucha contra oleadas infinitas de enemigos subterráneos, mejora tu nave y sobrevive al descenso. ¿Listo para la inmersión?",privacy:"Política de Privacidad",terms:"Términos del Servicio",contact:"Contactar Soporte",footer:"© 2026 Core Dive Guild. Todos los derechos reservados."},legal:{updatedPrefix:"Última Actualización:",date:"6 de noviembre de 2026",back:"Volver al Inicio"},privacy:{title:"Política de Privacidad de Core Dive",intro:"Core Dive Guild («nosotros») se compromete a proteger su privacidad. Esta Política de Privacidad explica cómo la aplicación móvil Core Dive (el «Juego») recopila, utiliza y divulga la información personal.",s1Title:"1. Información que Recopilamos",s1Intro:"Limitamos la información que utiliza el Juego a la necesaria para las funciones descritas a continuación:",s1Items:[{lead:"Servicios de Google Play Juegos:",text:"Si elige iniciar sesión, el Juego podrá acceder a su ID de Play Games, nombre visible y puntuaciones de clasificación. Esta información se utiliza para la autenticación, el guardado en la nube y las clasificaciones."},{lead:"Publicidad (Google AdMob):",text:"El Juego utiliza Google AdMob para ofrecer anuncios de vídeo con recompensa. AdMob puede recopilar o recibir su ID de publicidad e información del dispositivo para mostrar anuncios personalizados o no personalizados, medir el rendimiento de los anuncios y ayudar a prevenir el fraude."},{lead:"Datos del Juego:",text:"Su progreso —incluidas Monedas, Aspectos, Mejoras y Logros— se almacena localmente en su dispositivo y, cuando el inicio de sesión en Google Play Juegos está activado, se sincroniza con el guardado en la nube de Google Play."}],s2Title:"2. Cómo Usamos Su Información",s2Text:"Los datos se utilizan estrictamente para operar el Juego y proporcionar sus funciones. Esto incluye ejecutar la jugabilidad, habilitar el guardado en la nube y la sincronización del progreso, mantener las clasificaciones y ofrecer anuncios con recompensa. También podemos usar información de juego o de diagnóstico para corregir errores, proteger el Juego frente a abusos y responder a solicitudes de asistencia.",s3Title:"3. Compartir con Terceros",s3a:"No vendemos, intercambiamos ni alquilamos su información personal. Los únicos servicios de terceros implicados en las prácticas de datos descritas en esta política son servicios de Google: los Servicios de Google Play Juegos para el inicio de sesión, los guardados en la nube y las clasificaciones, y Google AdMob para la publicidad. La información procesada por esos servicios también está sujeta a la ",s3Link:"Política de Privacidad de Google",s3b:".",s4Title:"4. Conservación y Eliminación de Datos",s4Items:[{lead:"Datos locales:",text:"Los datos del juego almacenados en su dispositivo se conservan hasta que desinstale el Juego o borre los datos de la aplicación."},{lead:"Datos en la nube:",text:"Los datos de guardado en la nube se conservan mientras su cuenta de Google Play siga vinculada al Juego, sujeto a las prácticas de conservación propias de Google."},{lead:"Solicitudes de eliminación:",text:"Puede contactarnos para solicitar la eliminación de la información asociada al Juego. Es posible que necesitemos su ID de Play Games u otros datos razonables para localizar los datos pertinentes y verificar la solicitud."}],s5Title:"5. Contáctenos",s5a:"Si tiene preguntas sobre esta Política de Privacidad o desea realizar una solicitud de privacidad/eliminación, contáctenos en:"},terms:{title:"Términos del Servicio de Core Dive",intro:"Estos Términos del Servicio (los «Términos») rigen su uso de la aplicación móvil Core Dive (el «Juego») proporcionada por Core Dive Guild. Al descargar, instalar, acceder o jugar al Juego, usted acepta estos Términos. Si no está de acuerdo, no utilice el Juego.",s1Title:"1. Licencia de Uso del Juego",s1Text:"Sujeto a estos Términos y a los términos de la tienda de aplicaciones desde la que obtuvo el Juego, Core Dive Guild le otorga una licencia personal, no exclusiva, intransferible y revocable para instalar y usar el Juego para su propio entretenimiento personal y no comercial. Esta licencia no le otorga la propiedad del Juego ni de ninguno de sus contenidos.",s2Title:"2. Conducta del Usuario",s2Intro:"Usted acepta no realizar conductas que perjudiquen al Juego, a otros jugadores o a Core Dive Guild, entre ellas:",s2Items:[{lead:"Trampas y automatización:",text:"Usar trampas, exploits, bots, hacks, clientes modificados, scripts u otros métodos no autorizados para obtener ventaja o manipular puntuaciones, recompensas o jugabilidad."},{lead:"Ingeniería inversa:",text:"Copiar, modificar, descompilar, desensamblar o realizar ingeniería inversa del Juego, salvo cuando dicha actividad esté expresamente permitida por la ley aplicable."},{lead:"Interrupción:",text:"Interferir o interrumpir el Juego, sus servicios, servidores, redes o la capacidad de otra persona para usarlos."},{lead:"Suplantación de identidad:",text:"Falsear su identidad o suplantar a otra persona a través de perfiles, nombres visibles o funciones relacionadas de Google Play Juegos."}],s3Title:"3. Objetos Virtuales y Moneda",s3p1:"Las Monedas, Aspectos, Mejoras y otros objetos virtuales disponibles en el Juego se le licencian, no son de su propiedad. No tienen valor monetario real, no son transferibles fuera de las funciones expresamente previstas por el Juego y no pueden canjearse por dinero en efectivo u otra contraprestación.",s3p2:"Las compras son finales y no reembolsables, salvo cuando lo exija la ley aplicable o las políticas de la tienda de aplicaciones correspondiente. Core Dive Guild puede gestionar, modificar, suspender o eliminar objetos virtuales o moneda, incluso para corregir errores, abordar exploits o mantener el equilibrio del juego.",s4Title:"4. Anuncios",s4Text:"El Juego utiliza Google AdMob y puede ofrecer anuncios de vídeo con recompensa opcionales. Un anuncio con recompensa completado con éxito puede otorgar la moneda o recompensa del juego anunciada. El contenido publicitario de terceros es responsabilidad de su proveedor o anunciante, y Core Dive Guild no respalda los productos o servicios de terceros mostrados en los anuncios. Las recompensas solo se otorgan por anuncios completados con éxito y validados por el Juego.",s5Title:"5. Servicios de Google Play Juegos",s5Text:"El inicio de sesión en los Servicios de Google Play Juegos es opcional, pero algunas funciones —como el guardado en la nube y las clasificaciones— pueden requerirlo. Su uso de esos servicios también se rige por los términos y políticas de privacidad aplicables de Google. Las puntuaciones u otros envíos asociados con trampas o manipulación pueden eliminarse, y el acceso a las funciones relacionadas del Juego puede restringirse.",s6Title:"6. Propiedad Intelectual",s6Text:"El Juego y su contenido, incluidos el código, gráficos, ilustraciones, audio, texto, interfaces, personajes y materiales relacionados, son propiedad de Core Dive Guild o de sus licenciantes y están protegidos por las leyes de propiedad intelectual aplicables. Usted no recibe ningún derecho sobre el Juego ni su contenido más allá de la licencia limitada descrita en la Sección 1.",s7Title:"7. Actualizaciones y Cambios en el Juego",s7Text:"Core Dive Guild puede actualizar, modificar, suspender o interrumpir el Juego o cualquier función, contenido, objeto virtual o servicio en cualquier momento, incluso por motivos de mantenimiento, seguridad, equilibrio o negocio, sin previo aviso ni responsabilidad hacia usted.",s8Title:"8. Exclusión de Garantías",s8Text:"En la máxima medida permitida por la ley aplicable, el Juego se proporciona «tal cual» y «según disponibilidad», con todos sus defectos y sin garantías de ningún tipo, ya sean expresas, implícitas o legales. Core Dive Guild no garantiza que el Juego sea ininterrumpido, seguro, sin errores o compatible con todos los dispositivos, ni que el progreso guardado nunca se pierda.",s9Title:"9. Limitación de Responsabilidad",s9Text:"En la máxima medida permitida por la ley aplicable, Core Dive Guild y sus licenciantes no serán responsables de ningún daño indirecto, incidental, especial, consecuente o punitivo, ni de ninguna pérdida de progreso, objetos virtuales, moneda o datos, derivados de o relacionados con su uso o imposibilidad de usar el Juego.",s10Title:"10. Terminación",s10Text:"Core Dive Guild puede suspender o terminar su acceso al Juego o a funciones específicas, incluidas las clasificaciones y el guardado en la nube, si incumple estos Términos o usa indebidamente el Juego. Puede dejar de usar el Juego en cualquier momento desinstalándolo. Las Secciones 3, 6, 8 y 9 sobreviven a la terminación, junto con cualquier disposición que por su naturaleza deba sobrevivir.",s11Title:"11. Cambios en Estos Términos",s11Text:"Podemos actualizar estos Términos periódicamente. Cualquier versión actualizada se publicará en esta página con una nueva fecha de «Última actualización». Su uso continuado del Juego después de la entrada en vigor de los Términos actualizados constituye su aceptación de dichos Términos.",s12Title:"12. Contáctenos",s12a:"Si tiene preguntas sobre estos Términos o necesita asistencia para Core Dive, contáctenos en:"}}};function om(){try{const A=window.localStorage.getItem("coredive-lang");if(A&&Li[A])return A;const q=(navigator.language||"en").toLowerCase();return q.startsWith("vi")?"vi":q.startsWith("zh")?"zh":q.startsWith("ko")?"ko":q.startsWith("ja")?"ja":q.startsWith("de")?"de":q.startsWith("fr")?"fr":q.startsWith(
